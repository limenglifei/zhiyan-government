<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产业链分析报告生成中 · 智研平台</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#edf6ff 0,#f4f7fc 42%,#eef2f8 100%);font-family:"Microsoft YaHei",Arial;color:#1f3455;min-height:100vh;display:grid;place-items:center}.wrap{width:min(860px,92vw)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;color:#1e5eb8}.brand i{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#2078eb,#6a61e8);color:#fff;font-style:normal;font-weight:800}.card{padding:44px 54px;border:1px solid #dfe8f4;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 24px 65px rgba(43,75,119,.13)}.ai{width:74px;height:74px;margin:0 auto 20px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#2582f0,#6a5fe5);color:#fff;font-weight:800;font-size:22px;box-shadow:0 12px 30px rgba(44,112,225,.28);animation:pulse 1.6s infinite}h1{text-align:center;margin:0;font-size:26px}#chain{text-align:center;margin:9px 0 26px;color:#718099}.progress{height:8px;border-radius:10px;background:#edf1f7;overflow:hidden}.progress i{display:block;width:8%;height:100%;border-radius:10px;background:linear-gradient(90deg,#2382ef,#7060e9);transition:width .6s}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}.step{text-align:center;color:#9aa5b5}.step b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 8px;border-radius:50%;background:#eef2f7;color:#8592a6}.step span{font-size:12px}.step.active{color:#236bd1}.step.active b,.step.done b{background:#2d78e5;color:#fff}.step.done{color:#4c7ebe}.tip{text-align:center;margin-top:28px;color:#8996a8;font-size:12px}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 16px 38px rgba(44,112,225,.36)}}@media(max-width:650px){.card{padding:32px 20px}.steps{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="brand"><i>智</i><b>智研平台 · AI产业链分析师</b></div><section class="card"><div class="ai">AI</div><h1>正在生成产业链强链补链分析报告</h1><p id="chain">正在读取产业链数据……</p><div class="progress"><i id="bar"></i></div><div class="steps"><div class="step active"><b>1</b><span>读取产业链图谱</span></div><div class="step"><b>2</b><span>测算本地产业基础</span></div><div class="step"><b>3</b><span>识别薄弱环节</span></div><div class="step"><b>4</b><span>生成招商建议</span></div></div><p class="tip" id="tip">正在校验节点关系、链上企业及本地配套数据</p></section></main><script>
var p=new URLSearchParams(location.search),target=p.get('target'),chain=p.get('chain')||'目标产业链';document.getElementById('chain').textContent='分析对象：'+chain;var bars=[26,52,78,100],tips=['正在测算链条完备度与本地配套率','正在识别关键薄弱节点和能力缺口','正在召回并评估外地目标企业','报告生成完成，正在打开详情'];var i=0;function next(){document.querySelectorAll('.step').forEach(function(s,n){s.classList.toggle('done',n<i);s.classList.toggle('active',n===i)});document.getElementById('bar').style.width=bars[i]+'%';document.getElementById('tip').textContent=tips[i];i++;if(i<4)setTimeout(next,850);else setTimeout(function(){if(target)location.replace(target);else history.back()},650)}setTimeout(next,450);
</script></body></html>
